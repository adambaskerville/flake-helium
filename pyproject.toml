[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flake"
version = "1.0.0"
description = "High-precision helium ground-state energies on a laptop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "gmpy2>=2.1", "mpmath>=1.3"]

[project.scripts]
flake = "flake.cli:main"

[tool.setuptools]
packages = ["flake"]
